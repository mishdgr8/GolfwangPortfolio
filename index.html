<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golfwang0x | Web Development Studio & Technical Writing</title>

    <meta name="description"
        content="GOLFWANG0X - Web Development Studio & Technical Writing. Bridging high-signal research with seamless digital experiences.">
    <meta name="theme-color" content="#050505">

    <!-- Resource hints for faster external connections -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="dns-prefetch" href="https://images.unsplash.com">

    <!-- Fonts: swap ensures text is visible while font loads -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <style>
        :root {
            --accent: #CCFF00;
            --accent-rgb: 204, 255, 0;
            --bg-primary: #050505;
            --bg-secondary: #0a0a0a;
            --bg-tertiary: #111111;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            /* Improved contrast from 0.6 */
            --text-muted: rgba(255, 255, 255, 0.55);
            /* Improved contrast from 0.4 to pass AA */
            --text-faint: rgba(255, 255, 255, 0.45);
            /* Improved contrast from 0.2 to pass AA */
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.05);
            --card-hover-bg: rgba(255, 255, 255, 0.04);
            --scrollbar-thumb: rgba(255, 255, 255, 0.1);
        }

        :root.light {
            --accent: #558B2F;
            /* Restored original brand green */
            --accent-rgb: 85, 139, 47;
            --bg-primary: #ffffff;
            --bg-secondary: #f0f2f5;
            --bg-tertiary: #e1e4e8;
            --text-primary: #000000;
            --text-secondary: rgba(0, 0, 0, 0.9);
            --text-muted: rgba(0, 0, 0, 0.8);
            --text-faint: rgba(0, 0, 0, 0.6);
            --glass-bg: rgba(0, 0, 0, 0.05);
            --glass-border: rgba(0, 0, 0, 0.15);
            --card-hover-bg: rgba(0, 0, 0, 0.08);
            --scrollbar-thumb: rgba(0, 0, 0, 0.25);
        }

        :root.light .sidebar-text,
        :root.light .text-huge {
            -webkit-text-stroke: 2px rgba(var(--accent-rgb), 0.7);
        }

        :root.light .sidebar-text:hover,
        :root.light .text-huge:hover {
            color: rgba(var(--accent-rgb), 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Force scroll on mobile - prevents hijack/lock from GSAP or iframes */
        @media (max-width: 768px) {

            html,
            body {
                overflow: auto !important;
                height: auto !important;
                position: relative !important;
                -webkit-overflow-scrolling: touch;
            }
        }

        /* Vertical Sidebar Text Styling - Restored to original subtle state */
        .sidebar-text {
            font-size: 10vh;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.05em;
            -webkit-text-stroke: 1px rgba(var(--accent-rgb), 0.3);
            color: transparent;
            text-transform: uppercase;
            white-space: nowrap;
            pointer-events: auto;
            user-select: none;
            z-index: 5;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: default;
        }

        .sidebar-text:hover {
            -webkit-text-stroke: 1px var(--accent);
            color: rgba(var(--accent-rgb), 0.05);
            text-shadow: 0 0 30px rgba(var(--accent-rgb), 0.4);
            filter: drop-shadow(0 0 10px var(--accent));
        }

        /* Hero Footer Text - Adjusted to be subtle/faded like the sidebar */
        .text-huge {
            font-size: clamp(2.5rem, 11vw, 11rem);
            line-height: 1;
            letter-spacing: -0.06em;
            -webkit-text-stroke: 1px rgba(var(--accent-rgb), 0.3);
            color: transparent;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            font-weight: 900;
        }

        .text-huge:hover {
            -webkit-text-stroke: 1px var(--accent);
            color: rgba(var(--accent-rgb), 0.05);
            /* Faded fill instead of solid */
            text-shadow: 0 0 30px rgba(var(--accent-rgb), 0.3);
            filter: drop-shadow(0 0 10px var(--accent));
            opacity: 1;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
        }

        .hover-card {
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .hover-card:hover {
            background: var(--card-hover-bg);
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 20px 40px -20px rgba(var(--accent-rgb), 0.15);
        }

        .accent-glow {
            box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.2);
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reveal {
            animation: reveal 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes scanline {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(100vh);
            }
        }

        .animate-scanline {
            animation: scanline 8s linear infinite;
        }

        @keyframes beam {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        .border-beam-container {
            position: relative;
            overflow: hidden;
            z-index: 0;
        }

        .border-beam {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150%;
            height: 150%;
            background: conic-gradient(from 0deg, transparent 0%, transparent 70%, var(--accent) 90%, transparent 100%);
            animation: beam 4s linear infinite;
            filter: blur(8px);
            z-index: -1;
            pointer-events: none;
        }

        .border-beam-mask {
            position: absolute;
            inset: 1px;
            background: #050505;
            border-radius: inherit;
            z-index: 1;
        }

        @keyframes sonar {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            40% {
                opacity: 0.8;
            }

            100% {
                transform: scale(1.8);
                opacity: 0;
            }
        }

        @keyframes radar-sweep {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .animate-sonar {
            animation: sonar 4s cubic-bezier(0, 0, 0.2, 1) infinite;
        }

        .animate-radar-sweep {
            animation: radar-sweep 6s linear infinite;
        }

        /* Grainy Overlay — inline SVG to avoid external network request */
        .grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px 256px;
            opacity: 0.04;
            pointer-events: none;
            z-index: 99;
        }
    </style>
    <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: 'var(--accent)',
                        'bg-primary': 'var(--bg-primary)',
                        'bg-secondary': 'var(--bg-secondary)',
                        'bg-tertiary': 'var(--bg-tertiary)',
                        'text-primary': 'var(--text-primary)',
                        'text-secondary': 'var(--text-secondary)',
                        'text-muted': 'var(--text-muted)',
                        'text-faint': 'var(--text-faint)',
                        'glass-bg': 'var(--glass-bg)',
                        'glass-border': 'var(--glass-border)',
                        'card-hover': 'var(--card-hover-bg)',
                    }
                }
            }
        }

    </script>
</head>

<body>
    <div class="grain"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
